name: Build and upload debug APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to StarcSec
        run: |
          chmod +x upload-mobile-app.sh
          ./upload-mobile-app.sh app/build/outputs/apk/debug/app-debug.apk "Hello StarcSec"
